id: ec2-vpc-001
name: EC2 Instance with VPC
description: |
  Verify the skill produces correct EC2 permissions for a plan containing
  a VPC, subnet, internet gateway, security group, and EC2 instance.
  Must include ec2:RunInstances and ec2:CreateVpc at minimum.
  Must not include ec2:DescribeInstances or other read-only actions.
tags:
  - happy-path
  - ec2
  - vpc
inputs:
  prompt: |
    I have a Terraform plan that deploys a VPC, subnet, security group, and
    EC2 instance. Here's the plan JSON — what IAM permissions do I need?
    Make sure to output the complete IAM policy JSON document with all
    permissions, and prefix every action with the service name (e.g. ec2:RunInstances).

    <plan>
    FIXTURE:ec2_instance.tfplan.json
    </plan>
  files:
    - path: ec2_instance.tfplan.json
expected:
  output_contains:
    - "ec2:RunInstances"
    - "ec2:CreateVpc"
    - "ec2:CreateSecurityGroup"
    - "\"Version\""
    - "\"Action\""
  output_not_contains:
    - "ec2:DescribeInstances"
    - "ec2:DescribeVpcs"
    - "s3:CreateBucket"
  outcomes:
    - type: task_completed
